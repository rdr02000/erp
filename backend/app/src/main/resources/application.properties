server.port=8080
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
app.auth.jwt-secret=${APP_AUTH_JWT_SECRET}
app.auth.cookie-secure=${APP_AUTH_COOKIE_SECURE:false}
app.auth.cookie-same-site=${APP_AUTH_COOKIE_SAME_SITE:lax}

spring.ai.ollama.base-url=http://localhost:11434

# Chat Model Configurations
spring.ai.ollama.chat.model=llama3.2
spring.ai.ollama.chat.temperature=0.3

# Embedding Model Configurations (Required to parse docs into a vector database)
spring.ai.ollama.embedding.model=nomic-embed-text

# ERP database used by Spring Data JPA
spring.datasource.url=${ERP_DB_URL:jdbc:postgresql://localhost:5432/ERP}
spring.datasource.username=${ERP_DB_USERNAME:postgres}
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Separate database connection used by the RAG vector store
app.vectorstore.datasource.url=${VECTORSTORE_DB_URL:jdbc:postgresql://localhost:5432/VectorStore}
app.vectorstore.datasource.username=${VECTORSTORE_DB_USERNAME:postgres}
app.vectorstore.datasource.password=ramel
spring.datasource.password=ramel

# PGVector Configurations
# Dimensions must match your chosen embedding model (e.g., 1536 for OpenAI text-embedding-3-small)
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.table-name=vector_store_word_docs
# Optional: Set the distance type (Cosine is default and standard for text)
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
# Automatically create the table and vector extension if they don't exist
spring.ai.vectorstore.pgvector.initialize-schema=true


app.ingestion.directory=C:/Users/rosal/Downloads
